name: 2a_grasp_basket
agent_num: 2

image_shape: &image_shape [3, 256, 256]
action_shape: &action_shape [14]

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    # cam_right:
    #   shape: *image_shape
    #   type: rgb    
    cam_high:
      shape: *image_shape
      type: rgb
    # cam_left:
    #   shape: *image_shape
    #   type: rgb
    qpos:
      shape: *action_shape
      type: low_dim
  action:
    shape: *action_shape

dataset:
  _target_: dataset.dataset2dc_real.Dataset2D
  dataset_path: /root/autodl-tmp/basket_pick_up/grasp_basket.h5
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  input_meta: 
    obs:
      # cam_right: *image_shape
      # cam_left: *image_shape
      cam_high: *image_shape
      qpos: *action_shape
    action: *action_shape
  seperate_action: False
  use_mem: False
  
