defaults:
  - _self_
  - task: default_task

name: ${task.name}
task_name: ${task.name}
shape_meta: ${task.shape_meta}
dp_name: CDP3

seed: 42

horizon: 32
n_obs_steps: 20
n_action_steps: 8

# horizon: 12
# n_obs_steps: 4
# n_action_steps: 4
# horizon: 16
# n_obs_steps: 8
# n_action_steps: 4
# horizon: 24
# n_obs_steps: 16
# n_action_steps: 4

# horizon: 16
# n_obs_steps: 4
# n_action_steps: 4
# horizon: 20
# n_obs_steps: 8
# n_action_steps: 4
# horizon: 28
# n_obs_steps: 16
# n_action_steps: 4

# horizon: 18
# n_obs_steps: 8
# n_action_steps: 2
# horizon: 20
# n_obs_steps: 8
# n_action_steps: 4
# horizon: 24
# n_obs_steps: 8
# n_action_steps: 8

n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True

policy:
  # _target_: diffusion_policy.policy.cdp3.CDP3
  _target_: policy.cdp3.CDP3

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: sample

  optimizer_cfg: ${optimizer}
  scheduler_cfg: ${lr_scheduler}
  
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  n_layer: 8
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  obs_as_cond: ${obs_as_cond}
  use_point_crop: true
  condition_type: cross_attention
  encoder_output_dim: 1024
  crop_shape:
  - 80
  - 80
  use_pc_color: false
  pointnet_type: "pointnet"
  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false

  temporally_constant_weight: 0.1
  temporally_increasing_weight: 0.0
  temporally_random_weights: 0.0
  chunk_wise_weight: 0.9
  buffer_init: "zero"


  with_causal: true


  causal_condition_noise_weight: 6.0
  training_mode_thres: 0.2

ema:
  update_after_steps: 0

dataloader:
  train:
    batch_size: 128
    num_workers: 8
    shuffle: True
    pin_memory: True
  val:
    batch_size: 128
    num_workers: 8
    shuffle: False
    pin_memory: True

optimizer:
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6
  lr: 1.0e-4
  betas: [0.9, 0.95]

lr_scheduler:
  scheduler: cosine
  warmup_steps: 500
  
checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: val/loss
  mode: min
  save_top_k: 1
  save_last: True
  save_weights_only: False
  every_n_epochs: 1
  save_on_train_epoch_end: False
  filename: 'epoch={epoch:0>3d}-loss={val/loss:.4f}.ckpt'
  auto_insert_metric_name: False

trainer:
  max_epochs: 300
  accelerator: auto
  devices: auto
  precision: 32
  check_val_every_n_epoch: 2
  enable_progress_bar: True

logging:
  project: CDP3
  mode: offline
  name: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}
  tags: ["${task_name}"]
  id: null
  group: null

multi_run:
  run_dir:  _outputs/${dp_name}/${task_name}/${now:%Y.%m.%d.%H.%M.%S}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}

hydra:
  job:
    override_dirname: ${task_name}
  run:
    dir:  _outputs/${dp_name}/${task_name}/${now:%Y.%m.%d.%H.%M.%S}
  sweep:
    dir:  _outputs/${dp_name}/${task_name}/${now:%Y.%m.%d.%H.%M.%S}
    subdir: ${hydra.job.num}
