defaults:
  - _self_
  - task: default_task

name: ${task.name}
task_name: ${task.name}
shape_meta: ${task.shape_meta}
policy_name: DP2
info: 

seed: 42

horizon: 16
n_obs_steps: 3
n_action_steps: 14
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
obs_only_n_steps: True

policy:
  _target_: source.policy.dp2.DP2

  shape_meta: ${shape_meta}
  
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # Yilun's paper uses fixed_small_log instead, but easy to cause Nan
    clip_sample: True # required when predict_epsilon=False
    prediction_type: epsilon # or sample

  obs_encoder:
    _target_: source.model.DP2.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: source.model.DP2.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: null
    crop_shape: null
    # constant center crop
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  optimizer_cfg: ${optimizer}
  scheduler_cfg: ${lr_scheduler}

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  # crop_shape: null
  diffusion_step_embed_dim: 128
  # down_dims: [512, 1024, 2048]
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

  # scheduler.step params
  # predict_epsilon: True

ema:
  decay: 0.9
  update_every_n_steps: 1


dataloader:
  train:
    batch_size: 128
    num_workers: 4
    shuffle: True
    pin_memory: True
    persistent_workers: True
  val:
    batch_size: 128
    num_workers: 4
    shuffle: False
    pin_memory: True
    persistent_workers: True

optimizer:
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

lr_scheduler:
  scheduler: cosine
  warmup_steps: 500

checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: val/loss
  mode: min
  save_top_k: 5
  save_last: True
  save_weights_only: False
  every_n_epochs: 100
  save_on_train_epoch_end: False
  filename: 'epoch={epoch:0>3d}-loss={val/loss:.4f}'
  auto_insert_metric_name: False

trainer:
  max_epochs: 500
  accelerator: auto
  devices: 1
  precision: 32
  check_val_every_n_epoch: 1
  enable_progress_bar: True
  profiler: "simple"
  
training: # 用于存放trainer没有的参数
  debug: False
  seed: ${seed}
  progress_bar_refresh_rate: 10

logging:
  project: DP_real
  group: ${policy_name}_${task_name}
  name: ${policy_name}_${task_name}_${now:%Y.%m.%d-%H.%M.%S}_${info}
  mode: online
  tags: ["${task_name}", "${policy_name}"]


multi_run:
  run_dir:  _outputs/${policy_name}/${task_name}/${now:%Y.%m.%d.%H.%M.%S}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: _outputs/${policy_name}/${task_name}/${now:%Y.%m.%d.%H.%M.%S}
  sweep:
    dir: _outputs/${policy_name}/${task_name}/${now:%Y.%m.%d.%H.%M.%S}
    subdir: ${hydra.job.num}
